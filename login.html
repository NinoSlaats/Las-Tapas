<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Las Tapas - Medewerker Login</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #fdfbf7; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .login-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 320px; box-sizing: border-box; border-left: 6px solid #b33939; }
        h2 { color: #b33939; margin-top: 0; font-family: Georgia, serif; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #b33939; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        button:hover { background: #822626; }
        .login-fout { background: #fdecea; color: #922b21; border: 1px solid #f5c6c0; border-radius: 6px; padding: 10px; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>🍷 Las Tapas</h2>
        <p style="font-size: 0.85rem; color: #786a63;">Inloggen voor personeel</p>
        
        <p id="login-fout" class="login-fout" style="display: none;"></p>

        <form action="check_login.php" method="POST">
            <label>Gebruikersnaam</label>
            <input type="text" name="gebruikersnaam" required>

            <label>Wachtwoord</label>
            <input type="password" name="wachtwoord" required>

            <button type="submit">Inloggen</button>
        </form>
    </div>

    <script>
        // Foutmelding van check_login.php tonen (als tekst, dus veilig)
        const fout = new URLSearchParams(window.location.search).get('fout');
        if (fout) {
            const el = document.getElementById('login-fout');
            el.textContent = fout;
            el.style.display = 'block';
        }
    </script>
</body>
</html>
